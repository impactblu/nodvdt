<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Private PCS supplier catalog with searchable datasheets, reviewed specifications, and revision history.">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https: http://localhost:* http://127.0.0.1:* http://[::1]:*; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>PCS Atlas · Supplier catalog</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
  <script defer src="./config.js"></script>
  <script defer src="./client.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to catalog</a>
  <aside class="sidebar">
    <a href="#catalog" class="brand"><span class="brand-mark" aria-hidden="true">P</span><span>PCS<span class="brand-light">ATLAS</span></span></a>
    <div class="sidebar-caption">SUPPLIER INTELLIGENCE</div>
    <nav aria-label="Main navigation" id="nav"></nav>
    <div class="sidebar-foot"><span class="foot-label">YOUR WORKSPACE</span><p>Source. Review. Compare.</p><span class="muted">Private PCS research</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span id="breadcrumb">Workspace / Sign in</span><div class="session-actions"><span class="workspace-badge">PRIVATE CATALOG</span><button class="btn small-btn" id="sign-out" data-action="sign-out" hidden>Sign out</button></div></header>
    <main id="main" tabindex="-1"><div class="loading">Opening PCS Atlas…</div><noscript>Enable JavaScript to sign in and use your catalog.</noscript></main>
    <footer class="main-footer">PCS Atlas <span>Every specification has a source.</span></footer>
  </div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
